<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Plupack - React Homepage Dev</title>

    <!-- Google Fonts for local development -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&family=Open+Sans:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body,
      #root {
        width: 100%;
        min-height: 100%;
      }
    </style>
  </head>
  <body>
    <!-- Simulate Shopify Liquid variables for local dev -->
    <script>
      // This simulates what Liquid will inject in Shopify
      window.SHOPIFY_DATA = {
        shop: {
          name: 'Plupack Store',
          currency: 'USD',
        },
        product: {
          title: 'Sample Product',
          price: 29.99,
          images: ['/placeholder.jpg'],
        },
        settings: {
          backgroundColor: '#146C90',
          accentColor: '#ffffff',
        },
      };
    </script>

    <div id="root"></div>
    <script type="module" src="/src/entries/homepage.tsx"></script>
  </body>
</html>
